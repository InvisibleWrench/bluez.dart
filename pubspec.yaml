name: bluez
version: 0.8.3

description:
  Provides a client to connect to BlueZ - the Linux Bluetooth stack.

homepage: https://github.com/canonical/bluez.dart

environment:
  sdk: '>=2.17.0 <4.0.0'

platforms:
  linux:

dependencies:
  dbus: ^0.7.11
  # The peripheral GATT paths used to `print`. A library writing to stdout is a
  # library whose output cannot be levelled or filtered, and on a mortrix unit
  # stdout is the journal.
  logging: ^1.2.0

dev_dependencies:
  lints: ^2.0.0
  test: ^1.16.8
  test_cov: ^1.0.1
